/**:
  ros__parameters:
    registration_method: NDT_OMP
    score_threshold: 6.0
    ndt_resolution: 1.0
    ndt_step_size: 0.1
    ndt_num_threads: 4
    ndt_max_iterations: 35
    transform_epsilon: 0.01
    voxel_leaf_size: 0.2
    enable_scan_voxel_filter: true
    scan_max_range: 100.0
    scan_min_range: 1.0
    scan_period: 0.1
    use_pcd_map: true
    set_initial_pose: true
    initial_pose_qx: 0.0
    initial_pose_qy: 0.0
    use_odom: false
    use_twist_prediction: false
    use_odom_tf_prediction: true
    constrain_odom_tf_prediction_to_planar: true
    use_imu: false
    use_continuous_time_deskew: false
    enable_reinitialization_request_output: true
    enable_reinitialization_request_latch: true
    reinitialization_trigger_threshold: 0.95
    reinitialization_trigger_gap_scale_sec: 30.0
    reinitialization_trigger_seed_translation_scale_m: 100.0
    reinitialization_trigger_reject_streak_scale: 200.0
    reinitialization_trigger_fitness_explosion_threshold: 1000.0
    enable_debug: false
    predict_pose_from_previous_delta: true
    enable_local_map_crop: false
    reject_above_score_threshold: true
    enable_borderline_seed_rejection_gate: true
    enable_seed_correction_guard: true
    seed_correction_guard_translation_m: 0.5
    seed_correction_guard_yaw_deg: 15.0
    borderline_seed_gate_score_threshold: 5.25
    borderline_seed_gate_min_seed_translation_m: 1.0
    enable_map_odom_tf: true
    map_odom_tf_future_s: 0.5
    level_map_to_odom: true
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    enable_timer_publishing: false
    pose_publish_frequency: 30.0
