ekf_local:
  ros__parameters:
    use_sim_time: false                     # true when replaying a bag with --clock
    frequency: 30.0                         # output rate [Hz]
    sensor_timeout: 0.1                     # a sensor silent for longer is ignored [s]
    two_d_mode: true                        # planar motion: z, roll and pitch are not estimated
    smooth_lagged_data: true                # late measurements are fused at their own time
    history_length: 1.0                     # how far back late measurements are accepted [s]
    transform_time_offset: 0.0              # time added to the published transform [s]
    transform_timeout: 0.0                  # longest wait for a transform [s]
    print_diagnostics: true                 # publishes diagnostics
    publish_tf: true                        # publishes odom -> base_footprint
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom                       # the filter works in the odom frame

    # Each *_config lists what is fused, in this order:
    # x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az

    odom0: /a200_0000/platform/odom         # wheel odometry from the Raspberry Pi
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]     # forward and lateral velocity
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    odom1: /Odometry                        # FAST-LIO odometry
    odom1_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]     # x and y, as increments
    odom1_differential: true                # only the change between messages is fused
    odom1_queue_size: 10

    odom2: /Odometry                        # FAST-LIO odometry, a second time
    odom2_config: [false, false, false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]     # absolute yaw
    odom2_differential: false
    odom2_relative: false
    odom2_queue_size: 10

    imu0: /mavros/imu/data                  # Pixhawk IMU
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]      # yaw rate
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: false
