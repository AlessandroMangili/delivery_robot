bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    odom_topic: /odometry/local
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.3
      required_movement_angle: 0.3
      movement_time_allowance: 5.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.40
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 60
      model_dt: 0.1
      batch_size: 800
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.15
      vx_max: 0.30
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.25
      iteration_count: 1
      prune_distance: 2.5
      transform_tolerance: 0.5
      temperature: 0.2
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: true
      TrajectoryVisualizer:
        trajectory_step: 1000
        time_step: 1
      reset_period: 1.0
      regenerate_noises: false
      retry_attempt_limit: 1
      enforce_path_inversion: false
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic", "DetourCritic", "SpatioTemporalCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 25.0
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      SideChoiceCritic:
        enabled: true
        cost_weight: 10.0
        forward_weight: 10.0
        min_rotation_speed: 0.20
        time_window: 1.0
        check_distance: 2.0
        min_distance: 0.5
        block_cost: 253
        free_cost: 128
        max_offset: 2.0
        min_gap: 0.7
        width_cap: 2.0
        path_half_length: 0.4
        space_weight: 1.0
        path_weight: 1.0
        activation_angle_deg: 20.0
        deactivation_angle_deg: 8.0
        release_time: 2.0
      DetourCritic:
        enabled: true
        cost_weight: 5.0
        rotation_weight: 10.0
        forward_weight: 10.0
        min_rotation_speed: 0.25
        stuck_time: 1.2
        progress_distance: 0.15
        near_clearance: 0.25
        ignore_moving_tracks: true
        check_distance: 2.0
        corridor_half_width: 0.20
        block_cost: 254
        max_offset: 1.2
        min_gap: 0.8
        release_time: 1.5
        goal_distance: 1.0
      SpatioTemporalCritic:
        enabled: true
        prediction_horizon_s: 6.0
        line_weight: 0.0
        tracks_topic: /dynamic_tracks_state
        use_footprint: true
        collision_radius: 0.35
        max_track_age_s: 1.0
        publish_predictions: true
        publish_robot_trajectory: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      transform_tolerance: 0.5
      footprint: "[[0.45, 0.33], [0.45, -0.33], [-0.45, -0.33], [-0.45, 0.33]]"
      plugins: ["obstacle_layer", "semantic_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: lidar
        lidar:
          topic: /velodyne_points
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.25
          max_obstacle_height: 1.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
          raytrace_max_range: 7.0
          raytrace_min_range: 0.0
          expected_update_rate: 0.0
      semantic_layer:
        plugin: "dynamic_costmap_layer/SemanticLayer"
        enabled: true
        map_topic: /ssrl_costmap
        libera_impronta: false
        margine_impronta: 0.05
        libera_impronta_ostacoli: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.56
        cost_scaling_factor: 10.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.5
      footprint: "[[0.45, 0.33], [0.45, -0.33], [-0.45, -0.33], [-0.45, 0.33]]"
      resolution: 0.05
      track_unknown_space: true
      trinary_costmap: false
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /ssrl_costmap
        map_subscribe_transient_local: false
        trinary_costmap: false
        subscribe_to_updates: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.56
        cost_scaling_factor: 10.0
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.5
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.20
    min_rotational_vel: 0.10
    rotational_acc_lim: 0.3

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.30, 0.0, 0.25]
    min_velocity: [-0.15, 0.0, -0.25]
    max_accel: [0.4, 0.0, 0.3]
    max_decel: [-0.6, 0.0, -0.3]
    odom_topic: /odometry/local
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel"
    cmd_vel_out_topic: "cmd_vel_safe"
    transform_tolerance: 0.3
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["PolygonVicino"]
    PolygonVicino:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/impronta_sicurezza"
      time_before_collision: 1.5
      simulation_time_step: 0.1
      max_points: 10
      visualize: true
      polygon_pub_topic: "polygon_vicino"
      enabled: false
    observation_sources: ["lidar"]
    lidar:
      type: "pointcloud"
      topic: "/velodyne_points"
      min_height: 0.20
      max_height: 1.0
      enabled: true

cmd_vel_ponte:
  ros__parameters:
    use_sim_time: false
    in_topic: cmd_vel_safe
    out_topic: /a200_0000/cmd_vel
    frame_id: base_link
    max_lineare: 0.35
    max_angolare: 0.35
    rotazione_minima: 0.0

