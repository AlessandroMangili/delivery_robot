bt_navigator:
  ros__parameters:
    use_sim_time: true                       # Gazebo clock
    global_frame: map                        # frame of the goals and of the plan
    robot_base_frame: base_link              # robot frame
    odom_topic: /odom                        # odometry used by the behavior tree
    bt_loop_duration: 20                     # period of the behavior tree [ms]
    default_server_timeout: 200              # longest wait for an action server [ms]
    wait_for_service_timeout: 1000           # longest wait for a service [ms]
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: true                       # Gazebo clock
    controller_frequency: 10.0               # rate of MPPI [Hz]
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001          # smaller odometry speeds count as zero [m/s]
    min_y_velocity_threshold: 0.5            # smaller odometry speeds count as zero [m/s]
    min_theta_velocity_threshold: 0.001      # smaller odometry rotations count as zero [rad/s]
    failure_tolerance: 0.3                   # time MPPI may fail before the controller gives up [s]
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]  # checks when the goal is reached
    controller_plugins: ["FollowPath"]       # controller name, configured below
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"  # progress checker type
      required_movement_radius: 0.2          # the robot must move this much ... [m]
      movement_time_allowance: 30.0          # ... within this time, or the controller fails [s]
    general_goal_checker:
      stateful: True                         # once the position is reached, only the heading is checked
      plugin: "nav2_controller::SimpleGoalChecker"  # goal checker type
      xy_goal_tolerance: 0.15                # distance from the goal that counts as reached [m]
      yaw_goal_tolerance: 3.14               # heading error that counts as reached [rad]

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"  # MPPI controller

      time_steps: 80                         # steps of each sampled trajectory
      model_dt: 0.1                          # duration of a step: time_steps x model_dt is the 8 s horizon [s]
      batch_size: 2000                       # trajectories sampled at each cycle
      ax_max: 3.0                            # acceleration limits of the sampled controls
      ax_min: -3.0
      ay_max: 3.0
      az_max: 3.5
      vx_std: 0.2                            # noise of the sampled forward speed [m/s]
      vy_std: 0.0                            # no lateral motion on a differential drive [m/s]
      wz_std: 0.4                            # noise of the sampled rotation speed [rad/s]
      vx_max: 0.30                           # highest forward speed [m/s]
      vx_min: -0.1                           # highest reverse speed, 0 means no reverse [m/s]
      vy_max: 0.0                            # no lateral motion [m/s]
      wz_max: 1.9                            # highest rotation speed [rad/s]
      iteration_count: 2                     # optimization iterations per cycle
      prune_distance: 3.0                    # length of the global path given to the critics [m]
      transform_tolerance: 0.1               # largest accepted age of a transform [s]
      temperature: 0.1                       # softness of the weighted average: lower follows the best trajectory more closely
      gamma: 0.015                           # weight of the control smoothness in the cost
      motion_model: "DiffDrive"              # kinematic model of the robot
      visualize: true                        # publishes the sampled trajectories
      regenerate_noises: true                # samples new noise in a background thread

      TrajectoryVisualizer:
        trajectory_step: 2000                # one trajectory out of this many is drawn
        time_step: 3                         # one point out of this many is drawn

      AckermannConstraints:
        min_turning_r: 0.2

      critics: [                             # critics that score each trajectory, configured below
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic", "SpatioTemporalCritic"]

      SpatioTemporalCritic:
        enabled: true                        # turns this element on or off
        tracks_topic: "/dynamic_tracks_state"  # tracks from the EagerMOT tracker
        cost_mode: "both"                    # "overlap" (depth of the contact), "inv_ttc" (time to contact) or both
        cost_weight: 40.0                    # weight of the overlap term
        ttc_weight: 20.0                     # weight of the 1/(time to contact) term
        ttc_power: 1.0                       # power of that term: 1 = gradual, 2 = focused on imminent contacts
        ttc_epsilon: 0.1                     # caps the term at 1/epsilon [s]
        diag_period_calls: 10                # one [STC] diagnostic line every N cycles (0 = off)
        cost_power: 1                        # power applied to the cost
        collision_radius: 0.72               # robot radius 0.22 + person 0.30 + margin 0.20 [m]
        vel_std_gain: 0.4                    # the radius grows with velocity std x time
        max_vel_std: 0.8                     # tracks with a less certain velocity are ignored [m/s]
        prediction_horizon_s: 3.0            # how far ahead people are predicted [s]
        max_radius: 1.5                      # ceiling of the radius [m]
        min_ped_speed: 0.4                   # slower tracks are left to the costmap [m/s]
        max_track_age_s: 0.5                 # older track messages are ignored [s]
        rear_filter: true                    # people behind the robot count only when predicted in front of it
        rear_use_prediction: false           # false = the current position decides, true = the prediction
        rear_margin_m: 0.2                   # "behind" starts this far behind the robot centre [m]
        rear_keep_close: false               # true = people within rear_keep_radius_m always count
        rear_keep_radius_m: 1.0              # radius used by rear_keep_close [m]
        rear_on_reverse: true                # trajectories that reverse also count people behind
        worst_case: true                     # a trajectory takes the closest approach, not the sum
        publish_predictions: true            # publishes the predicted positions for display
        predictions_topic: "/spatiotemporal_critic/predictions"  # predicted positions for RViz

      ConstraintCritic:
        enabled: true                        # turns this element on or off
        cost_power: 1                        # power applied to the cost
        cost_weight: 4.0                     # penalizes speeds outside the limits

      GoalCritic:
        enabled: true                        # turns this element on or off
        cost_power: 1                        # power applied to the cost
        cost_weight: 5.0                     # pulls trajectories towards the goal
        threshold_to_consider: 1.4           # active only within this distance of the goal [m]

      GoalAngleCritic:
        enabled: true                        # turns this element on or off
        cost_power: 1                        # power applied to the cost
        cost_weight: 3.0                     # aligns the robot with the goal heading
        threshold_to_consider: 0.5           # active only within this distance of the goal [m]

      PreferForwardCritic:
        enabled: true                        # turns this element on or off
        cost_power: 1                        # power applied to the cost
        cost_weight: 5.0                     # penalizes reversing
        threshold_to_consider: 0.5           # inactive within this distance of the goal [m]

      CostCritic:
        enabled: true                        # turns this element on or off
        cost_power: 1                        # power applied to the cost
        cost_weight: 25.0                    # how strongly trajectories avoid cost, including the confinement
        critical_cost: 300.0                 # cost above which a trajectory is penalized strongly
        consider_footprint: false            # checks the whole footprint, not only the centre
        collision_cost: 1000000.0            # cost of a trajectory that collides
        near_goal_distance: 1.0              # distance from the goal where the cost is relaxed [m]
        trajectory_point_step: 2             # one point out of this many is checked

      PathAlignCritic:
        enabled: true                        # turns this element on or off
        cost_power: 1                        # power applied to the cost
        cost_weight: 6.0                     # keeps trajectories close to the global path
        max_path_occupancy_ratio: 0.05       # inactive when this share of the path is blocked
        trajectory_point_step: 4             # one point out of this many is checked
        threshold_to_consider: 0.5           # inactive within this distance of the goal [m]
        offset_from_furthest: 20             # path points ahead of the furthest reached point that are used
        use_path_orientations: false         # ignores the orientation of the path points

      PathFollowCritic:
        enabled: true                        # turns this element on or off
        cost_power: 1                        # power applied to the cost
        cost_weight: 5.0                     # pulls trajectories along the global path
        offset_from_furthest: 5              # path points ahead of the furthest reached point that are used
        threshold_to_consider: 1.4           # inactive within this distance of the goal [m]

      PathAngleCritic:
        enabled: true                        # turns this element on or off
        cost_power: 1                        # power applied to the cost
        cost_weight: 2.0                     # turns the robot towards the path
        offset_from_furthest: 4              # path points ahead of the furthest reached point that are used
        threshold_to_consider: 0.5           # inactive within this distance of the goal [m]
        max_angle_to_furthest: 1.0           # active above this heading error [rad]
        mode: 0                              # forward motion only

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true                     # Gazebo clock
      update_frequency: 10.0                 # update rate [Hz]
      publish_frequency: 5.0                 # publication rate [Hz]
      global_frame: odom                     # the local costmap moves with the odometry
      robot_base_frame: base_link            # robot frame
      rolling_window: true                   # the costmap follows the robot
      width: 6                               # size [m]
      height: 6                              # size [m]
      resolution: 0.05                       # cell size [m]
      robot_radius: 0.22                     # TurtleBot3 radius [m]
      plugins: ["semantic_layer", "obstacle_layer", "inflation_layer"]  # layers, configured below

      semantic_layer:
        plugin: "dynamic_costmap_layer/SemanticLayer"  # injects the fused map, see dynamic_costmap_layer
        enabled: true                        # turns this element on or off
        map_topic: /ssrl_costmap             # fused map

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"  # obstacles seen by the LiDAR
        enabled: True                        # turns this element on or off
        footprint_clearing_enabled: True     # clears the cells under the robot
        observation_sources: pc_mark pc_clear  # sensors, configured below
        pc_mark:
          topic: /scan/points                # simulated LiDAR
          data_type: "PointCloud2"
          marking: True
          clearing: False
          min_obstacle_height: 0.10          # points between these heights mark obstacles [m]
          max_obstacle_height: 0.3           # robot height plus a margin: the robot passes below higher objects [m]
          obstacle_max_range: 4.5            # [m]
          obstacle_min_range: 0.35           # [m]
        pc_clear:
          topic: /scan/points
          data_type: "PointCloud2"
          marking: False
          clearing: True
          min_obstacle_height: -0.5          # clearing rays include the ground [m]
          max_obstacle_height: 2.0
          raytrace_max_range: 5.0            # [m]
          raytrace_min_range: 0.35           # [m]

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"  # cost decaying around lethal cells
        cost_scaling_factor: 3.0             # decay rate of the inflated cost
        inflation_radius: 0.4                # distance over which the cost decays [m]
      always_send_full_costmap: True         # publishes the whole costmap each time

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true                     # Gazebo clock
      width: 50                              # size [m]
      height: 50                             # size [m]
      update_frequency: 5.0                  # update rate [Hz]
      publish_frequency: 2.0                 # publication rate [Hz]
      global_frame: map                      # the global costmap is fixed on the map
      robot_base_frame: base_link            # robot frame
      robot_radius: 0.22                     # TurtleBot3 radius [m]
      resolution: 0.05                       # cell size [m]
      track_unknown_space: true              # keeps unknown cells as unknown
      trinary_costmap: false                 # keeps the full 0-100 cost of the map
      plugins: ["static_layer", "inflation_layer"]  # layers, configured below

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"  # layer that reads a map topic
        map_topic: /ssrl_costmap             # fused map
        map_subscribe_transient_local: False  # subscribes without transient local durability
        trinary_costmap: false               # keeps the full 0-100 cost of the map
        subscribe_to_updates: false          # reads only full map messages

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"  # cost decaying around lethal cells
        cost_scaling_factor: 8.0             # decay rate of the inflated cost
        inflation_radius: 0.3                # distance over which the cost decays [m]
      always_send_full_costmap: True         # publishes the whole costmap each time

planner_server:
  ros__parameters:
    use_sim_time: true                       # Gazebo clock
    expected_planner_frequency: 1.0          # expected rate of the planner [Hz]
    planner_plugins: ["GridBased"]           # planner name, configured below

    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"  # 2D A* planner on the costmap
      tolerance: 0.125                       # distance from the goal accepted if the goal is blocked [m]
      downsample_costmap: false              # plans at full resolution
      downsampling_factor: 1                 # unused without downsampling
      allow_unknown: true                    # plans through unknown cells
      max_iterations: 1000000                # search iterations before giving up
      max_on_approach_iterations: 1000       # iterations allowed near the goal
      max_planning_time: 2.0                 # longest planning time [s]
      cost_travel_multiplier: 30.0           # weight of the cost against the path length
      use_final_approach_orientation: true   # ignores the goal heading when planning
      smoother:
        max_iterations: 1000                 # smoothing iterations
        w_smooth: 0.3                        # smoothing weight
        w_data: 0.2                          # weight that keeps the smoothed path close to the original
        tolerance: 1.0e-10                   # convergence tolerance of the smoother

smoother_server:
  ros__parameters:
    use_sim_time: true                       # Gazebo clock
    smoother_plugins: ["simple_smoother"]    # smoother name, configured below
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"  # path smoother
      tolerance: 1.0e-10                     # convergence tolerance of the smoother
      max_its: 1000                          # smoothing iterations
      do_refinement: True                    # refines the smoothed path

behavior_server:
  ros__parameters:
    use_sim_time: true                       # Gazebo clock
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0                    # rate of the behaviors [Hz]
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]  # available behaviors, configured below
    spin:
      plugin: "nav2_behaviors/Spin"          # plugin type
    backup:
      plugin: "nav2_behaviors/BackUp"        # plugin type
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"  # plugin type
    wait:
      plugin: "nav2_behaviors/Wait"          # plugin type
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"  # plugin type
    local_frame: odom
    global_frame: map                        # frame of the behaviors
    robot_base_frame: base_link              # robot frame
    transform_tolerance: 0.5                 # largest accepted age of a transform [s]
    simulate_ahead_time: 2.0                 # time a behavior checks ahead for collisions [s]
    max_rotational_vel: 1.0                  # highest rotation speed of the behaviors [rad/s]
    min_rotational_vel: 0.4                  # lowest rotation speed of the behaviors [rad/s]
    rotational_acc_lim: 3.2                  # rotation acceleration of the behaviors [rad/s^2]

waypoint_follower:
  ros__parameters:
    use_sim_time: true                       # Gazebo clock
    loop_rate: 20                            # rate of the waypoint follower [Hz]
    stop_on_failure: false                   # continues to the next waypoint after a failure
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"  # task run at each waypoint
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"  # plugin type
      enabled: True                          # turns this element on or off
      waypoint_pause_duration: 200           # pause at each waypoint [ms]

velocity_smoother:
  ros__parameters:
    use_sim_time: true                       # Gazebo clock
    smoothing_frequency: 20.0                # output rate [Hz]
    scale_velocities: False                  # does not rescale the axes together
    feedback: "OPEN_LOOP"                    # no odometry feedback
    max_velocity: [0.5, 0.0, 2.0]            # highest vx, vy, wz
    min_velocity: [-0.5, 0.0, -2.0]          # lowest vx, vy, wz
    max_accel: [2.5, 0.0, 3.2]               # highest acceleration of vx, vy, wz
    max_decel: [-2.5, 0.0, -3.2]             # highest deceleration of vx, vy, wz
    odom_topic: "odom"                       # odometry (unused in open loop)
    odom_duration: 0.1                       # odometry averaging window [s]
    deadband_velocity: [0.0, 0.0, 0.0]       # no dead band
    velocity_timeout: 1.0                    # stops when no command arrives for this long [s]
