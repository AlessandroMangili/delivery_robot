bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: true
    # 10 Hz (era 20.0): i 20 Hz non venivano comunque rispettati ("Control loop
    # missed its desired rate"). Meglio 10 Hz onesti e rispettati che 20 falliti.
    # Dimezza il carico e permette a model_dt di crescere -> orizzonte piu' lungo.
    controller_frequency: 10.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 30.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 3.14

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # ----- MPPI (primary_controller) -----
      # ORIZZONTE SPAZIALE = time_steps * model_dt * vx_max
      #   PRIMA: 90 * 0.05 * 0.30 = 1.35 m  -> traiettorie CORTE: non toccavano
      #          nemmeno il cono (lungo 4 m) -> costo 0 -> MPPI cieco, poi sterzata
      #          brusca quando il cono entrava nei 1.35 m ("reagisce all'ultimo").
      #   ORA:   80 * 0.10 * 0.30 = 2.40 m  -> quasi il doppio, e con MENO step (80<90).
      # model_dt DEVE restare = 1/controller_frequency (0.1 = 1/10Hz), cosi' resta
      # attivo il "control sequence shifting" (lo vedi nei log all'avvio).
      time_steps: 80
      model_dt: 0.1
      batch_size: 2000
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      az_max: 3.5
      vx_std: 0.2
      vy_std: 0.0                 
      wz_std: 0.4
      vx_max: 0.30                # allineato al max tarato del robot (era 0.5)
      vx_min: 0.0                 # niente retro (come il tuo DWB); metti -0.35 per consentirlo
      vy_max: 0.0                 
      wz_max: 1.9
      iteration_count: 2          # era 1: rifinisce la scelta (aiuta a impegnarsi su un lato)
      prune_distance: 3.0         # era 1.7: teneva il path di riferimento PIU' CORTO del nuovo orizzonte (2.4 m) -> lo strozzava.
      transform_tolerance: 0.1
      temperature: 0.1            # era 0.3: PIU' BASSO = si concentra sulla traiettoria migliore e SCEGLIE un lato, invece di mediare sx+dx -> dritto.
                                  # Se diventa nervoso/oscilla, risali verso 0.2
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false            # Rimettilo a true SOLO quando devi ispezionare le traiettorie.
      regenerate_noises: true

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      AckermannConstraints:
        min_turning_r: 0.2      

      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic", "SpatioTemporalCritic"]

      SpatioTemporalCritic:
        enabled: true
        tracks_topic: "/dynamic_tracks_state"
        cost_weight: 40.0
        cost_power: 1
        collision_radius: 0.5
        vel_std_gain: 0.4
        max_vel_std: 0.8
        prediction_horizon_s: 3.0
        max_radius: 1.5
        min_ped_speed: 0.4
        max_track_age_s: 0.5
        publish_predictions: true
        predictions_topic: "/spatiotemporal_critic/predictions"
        free_space_enabled: true
        free_space_weight: 15.0
        free_space_radius: 0.5
        free_space_ratio: 1.0
        free_space_unknown_cost: 0.3

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

      # >>>>> CostCritic = LA MANOPOLA DELL'EVITAMENTO <<<<<
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 25.0          # era 8.0: alzato MOLTO per deviare in anticipo dal cono se vaga fuori dal path SENZA pedoni, scendi verso 15-20
        critical_cost: 300.0
        consider_footprint: false  # robot circolare (robot_radius): check su raggio/centro, non poligono
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0           # era 14.0: abbassato per lasciare che si stacchi dal path e aggiri il cono. Se vaga senza motivo, rialza verso 10-12
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.22
      plugins: ["semantic_layer", "obstacle_layer", "dynamic_layer", "inflation_layer"]

      semantic_layer:
        plugin: "dynamic_costmap_layer/SemanticLayer"
        enabled: true
        map_topic: /ssrl_costmap

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: True
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      # --- DYNAMIC LAYER = cono anticipatorio dei dinamici (plugin C++) ---
      dynamic_layer:
        plugin: "dynamic_costmap_layer/DynamicLayer"
        enabled: true
        dynamic_cost_topic: /dynamic_cost
        cost_threshold: 1
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.4
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      width: 50
      height: 50
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      trinary_costmap: false
      plugins: ["static_layer", "inflation_layer"]

      # --- STATIC LAYER = il tuo costmap semantico SSRL ---
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /ssrl_costmap
        map_subscribe_transient_local: False
        trinary_costmap: false
        subscribe_to_updates: false

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.4
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.125
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 30.0
      # true = l'orientamento finale del percorso segue la DIREZIONE DI ARRIVO,
      # non l'heading comandato nel goal -> il robot arriva gia' rivolto giusto e
      # non fa il 180 sul posto per allinearsi a un heading all'indietro.
      use_final_approach_orientation: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 2.0]
    min_velocity: [-0.5, 0.0, -2.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15