gt_segmentation_relay:
  ros__parameters:
    labels_topic: /semantic/labels_map     # Gazebo semantic camera topic (input)
    out_topic: /semantic/segmentation      # segmentation in Cityscapes IDs (output)
    publish_overlay: true                  # also publish the coloured debug overlay

semantic_costmap_node:
  ros__parameters:
    # Frames
    target_frame: map                                 # persistent map frame (fixed, global)
    camera_optical_frame: camera_rgb_optical_frame    # camera optical frame (for IPM)
    base_frame: base_footprint                        # robot base frame (pose / window)

    # Grid
    resolution: 0.05                       # [m/cell] map resolution (5 cm)
    initial_size_m: 10.0                   # [m] initial grid side, then auto grow
    grow_margin_m: 3.0                     # [m] margin added on each auto expansion

    # Pixel
    pixel_stride: 4                        # sample 1 pixel every N
    max_range: 5.5                         # [m] max distance considered for view/occlusion
    min_row_frac: 0.55                     # sample the image from this fraction downward (0.55 = lower half = the ground)
    map_write_max_range: 5.0               # [m] WRITE to map only within this range (where IPM is accurate)

    # Depth
    depth_topic: /camera/depth_image
    depth_write_max_m: 6.0                 # [m] scrivi solo entro questa distanza (depth affidabile). Alza se serve il suolo piu' lontano, sapendo che oltre ~6-7 m la depth e' rumorosa
    max_obstacle_height: 0.60              # [m] sopra questa quota non scrivere: chiome, tettoie, insegne sotto cui il robot passa
    depth_max_age_s: 0.5                   # depth piu' vecchia di cosi' = non usata
    veto_verbose: false                    # true = logga quanti pixel misurati/scartati per frame

    # Full map publishing
    full_map_period_s: 1.0                 # [s] republish the full map every N seconds
    significant_change_cells: 15           # if >= N cells change meaningfully, publish IMMEDIATELY

    # Occlusion (polar z-buffer)
    occ_sector_deg: 2.0                    # [deg] angular width of z-buffer sectors
    occ_margin: 0.15                       # [m] beyond the first obstacle before calling it "occluded"
    occ_weak: 0.10                         # weight of an occluded observation (0.1 = nearly ignored, but not dropped: can still confirm over time)
    w_dist_min: 0.03                       # min weight of an observation at max_range (near ~1, far small)

    blocker_classes: [2,3,4,5,7,8,11,12,13,14,15,16,17,18]

    # Map persistence
    map_save_name: 'map2'                  # empty = don't save
    map_load_name: 'map2'                  # empty = start from scratch
    autosave: false                        # true = save the map on node SHUTDOWN

    # Dynamic objects exclusion
    dynamic_classes: [11,12,13,14,15,16,17,18]
    dyn_v_thresh: 0.3                             # [m/s] above = "moving"
    dyn_gate: 1.0                                 # [m] max distance to associate a track across frames
    dyn_min_obs: 3                                # min frames before trusting the estimated velocity
    dyn_timeout: 1.0                              # [s] max age of a track no longer seen
    dyn_vel_beta: 0.6                             # velocity smoothing (EMA)
    map_static_dynamics: false             # false = a dynamic-class object NEVER writes to the map, even when still
    dyn_dilate_px: 6                       # [px] halo around dynamics where nothing is written (catches mis-segmented edge pixels and IPM smear of the body)

    conf_max: 8.0          # evidence CEILING (no cell is immortal)
    conf_init: 2.0         # defence of a just-entered cell (low: must earn it)
    confirm_gain: 1.0      # one confirmation is worth +1 * weight
    deny_penalty: 2.0      # one denial is worth -2 * weight
    conf_decay: 0.99       # evidence of unseen cells ages (-1%/s)

    # MAP ENTRY: only after N CONSECUTIVE confirmations, then written OUTRIGHT
    new_hits: 4            # 2 = permissive / 4 = strict
    change_hits: 2         # consecutive confirmations of the OPPOSITE class to flip a cell (on top of C reaching 0)

    # ROBUST localization gate (EMA + hysteresis)
    use_loc_quality_gate: true             # enable/disable the gate
    loc_pose_topic: /odometry/filtered     # pose-with-covariance topic (/amcl_pose for AMCL)
    loc_cov_source: odometry               # 'pose_with_cov' for AMCL, 'odometry' for EKF (robot_localization)
    loc_std_suspend_m: 1.0                 # [m] smoothed std above this -> SUSPEND
    loc_std_resume_m: 0.5                  # [m] below this -> RESUME (hysteresis)
    loc_cov_ema: 0.4                       # covariance smoothing (0..1; higher = more reactive)

confinement_layer:
  ros__parameters:
    in_topic: /semantic_costmap            # semantic map in (latched)
    out_topic: /confinement_cost           # confinement field out (latched)
    sidewalk_cost_max: 15                  # cells with cost <= this = sidewalk
    conf_max: 35.0                         # confinement cost AT the sidewalk edge
    falloff: 0.4                           # [m] exponential decay toward the centre (at 0.4 m ~30, at 1 m ~7)
    include_unknown_as_edge: false         # false = unknown does NOT repel, so the robot explores it

ssrl_combiner:
  ros__parameters:
    semantic_topic: /semantic_costmap      # measure map (classes -> costs)
    layer_topics: ['/confinement_cost']    # risk layers to add (future: add dynamics here)
    out_topic: /ssrl_costmap               # final costmap for the Nav2 global costmap