gt_segmentation_node:
  ros__parameters:
    labels_topic: /semantic/labels_map     # label image of the Gazebo segmentation camera (input)
    out_topic: /semantic/segmentation      # segmentation as Cityscapes IDs (output)
    publish_overlay: false                 # /semantic/overlay, the coloured segmentation

semantic_costmap_node:
  ros__parameters:
    target_frame: map                                 # frame of the persistent map
    camera_optical_frame: camera_rgb_optical_frame    # camera frame: LiDAR points are projected into the image to read their class
    base_frame: base_footprint                        # robot frame

    resolution: 0.05                       # cell size [m]
    initial_size_m: 10.0                   # initial side of the map, it grows as needed [m]
    grow_margin_m: 3.0                     # margin added at each growth [m]

    lidar_topic: /scan/points              # raw LiDAR cloud
    lidar_frame: base_scan                 # LiDAR frame
    lidar_max_age_s: 0.3                   # a cloud older than this is not paired with the image [s]
    lidar_min_range: 0.4                   # closer points are dropped [m]

    max_range: 5.5                         # range of the distance weight and of the occlusion test [m]
    map_write_max_range: 3.0               # only points closer than this are written [m]
    max_obstacle_height: 0.20              # points higher than this above the ground are not written: the robot passes below [m]

    full_map_period_s: 1.0                 # the full map is published every N seconds [s]
    significant_change_cells: 15           # if at least N cells change, the full map is published at once

    occ_sector_deg: 2.0                    # angular width of the occlusion sectors [deg]
    occ_margin: 0.15                       # distance behind the first obstacle before a point counts as occluded [m]
    w_dist_min: 0.03                       # smallest distance weight, at max_range

    blocker_classes: [2,3,4,5,7,8,11,12,13,14,15,16,17,18]   # classes that block the view behind them

    map_save_name: 'map1'                  # name of the saved map, empty = do not save
    map_load_name: 'map1'                  # name of the map to load, empty = start empty
    autosave: false                        # save when the node shuts down

    dynamic_classes: [11,12,13,14,15,16,17,18]   # people and vehicles: never written into the map
    dyn_v_thresh: 0.3                      # speed above which an object counts as moving [m/s]
    dyn_gate: 1.0                          # largest distance to associate an object between frames [m]
    dyn_min_obs: 3                         # frames before the estimated speed is trusted
    dyn_timeout: 1.0                       # an object not seen for this long is forgotten [s]
    dyn_vel_beta: 0.6                      # smoothing of the speed (EMA)
    map_static_dynamics: false             # false = a dynamic class is never written, even when still
    dyn_dilate_px: 6                       # no-write margin around dynamic objects in the image [px]

    conf_max: 8.0                          # ceiling of the evidence of a cell
    conf_init: 2.0                         # evidence of a cell that has just entered the map
    confirm_gain: 1.0                      # evidence added by a confirmation, times the weight
    deny_penalty: 2.0                      # evidence removed by a contradiction, times the weight
    conf_decay: 0.99                       # evidence of cells not in view decays by 1 % per second

    new_hits: 4                            # consecutive observations before a cell enters the map
    change_hits: 2                         # consecutive observations of another class before a cell changes class

    use_loc_quality_gate: true             # stop writing when the localization is uncertain
    loc_pose_topic: /odometry/global       # pose with covariance used by the gate
    loc_cov_source: odometry               # the pose comes from robot_localization
    loc_std_suspend_m: 0.15                # writing stops above this smoothed position std [m]
    loc_std_resume_m: 0.08                 # writing resumes below this [m]
    loc_cov_ema: 0.4                       # smoothing of the covariance (0..1, higher = faster)

elevation_costmap_node:
  ros__parameters:
    target_frame: map
    base_frame: base_footprint
    lidar_frame: base_scan
    camera_optical_frame: camera_rgb_optical_frame   # used to project points and drop dynamic objects

    resolution: 0.05                       # cell size [m]
    initial_size_m: 10.0                   # initial side of the map [m]
    grow_margin_m: 3.0                     # margin added at each growth [m]

    lidar_topic: /scan/points
    lidar_max_age_s: 0.3                   # a cloud older than this is not used [s]
    lidar_min_range: 0.4                   # closer points are dropped [m]
    map_write_max_range: 5.0               # only points closer than this are written [m]
    elev_min_rel: -1.0                     # points this far below the robot are dropped [m]
    elev_max_rel: 1.0                      # points this far above the robot are dropped (trees, signs) [m]

    seg_topic: /semantic/segmentation      # segmentation, used only to drop dynamic objects
    camera_info_topic: /camera/camera_info
    seg_max_age_s: 0.3                     # a segmentation older than this is not used [s]
    dynamic_classes: [11,12,13,14,15,16,17,18]
    dyn_dilate_px: 12                      # no-write margin around dynamic objects in the image [px]

    sensor_var_base: 0.0009                # base variance of a height measurement [m^2]
    sensor_var_dist: 0.0004                # extra variance per squared metre of range
    var_init: 1.0                          # variance of a cell never seen [m^2]
    var_max: 1.0                           # ceiling of the variance [m^2]
    process_var_rate: 0.05                 # variance added per second to every cell [m^2/s]
    maha_thresh: 5.0                       # Mahalanobis gate against outliers
    min_var_for_valid: 0.25                # cells with a larger variance count as unknown [m^2]

    rough_win: 5                           # window of the roughness [cells]
    rough_min_known: 6                     # known neighbours needed for the roughness
    slope_crit: 0.35                       # slope with the highest cost (about 19 deg) [m/m]
    rough_crit: 0.06                       # roughness with the highest cost [m]
    step_crit: 0.06                        # step with the highest cost (a kerb) [m]

    median_ksize: 5                        # median filter on the heights (0 or 1 = off)
    slope_dead: 0.04                       # slope below this costs nothing [m/m]
    rough_dead: 0.025                      # roughness below this costs nothing [m]
    step_dead: 0.02                        # step below this costs nothing [m]

    publish_period_s: 1.0                  # publishing period [s]
    out_topic: /elevation_cost

    use_loc_quality_gate: true             # same gate as the semantic map
    loc_pose_topic: /odometry/global
    loc_std_suspend_m: 0.15
    loc_std_resume_m: 0.08
    loc_cov_ema: 0.4

    map_save_name: 'elevation1'
    map_load_name: 'elevation1'
    autosave: false

ssrl_combiner:
  ros__parameters:
    semantic_topic: /semantic_costmap
    elevation_topic: /elevation_cost
    out_topic: /ssrl_costmap               # combined map read by Nav2
    use_confinement: true                  # adds a cost that grows towards the sidewalk edges
    sidewalk_cost_max: 15                  # semantic cost up to which a cell counts as sidewalk
    conf_max: 40.0                         # confinement cost at the edge
    falloff: 0.4                           # decay length of the confinement cost [m]
    include_unknown_as_edge: false         # unknown cells do not count as an edge
    publish_confinement: true              # publishes /confinement_cost for RViz
    confinement_topic: /confinement_cost
    use_elevation: true                    # adds the elevation cost
    w_elev: 0.6                            # share of the room left below soft_ceiling that the elevation can use
    soft_ceiling: 97                       # ceiling of the combined cost when elevation is added
    elev_can_be_lethal: false              # the elevation alone never makes a cell lethal
    elev_lethal_thr: 92                    # elevation cost that would be lethal if allowed
    grid_tol_cells: 0.01                   # tolerance when checking that two grids are aligned [cells]
