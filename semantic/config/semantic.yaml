semantic_costmap_node:
  ros__parameters:
    target_frame: odom                                 # persistent map frame (fixed, global)
    camera_optical_frame: c920_optical
    camera_info_topic: /c920/camera_info
    seg_topic: /semantic/segmentation
    base_frame: base_footprint

    resolution: 0.05                       # [m/cell] risoluzione mappa (5 cm) -- giustificata dal density study (>=1 pt/cella fino a ~10 m)
    initial_size_m: 10.0                   # [m] lato iniziale, poi auto-grow
    grow_margin_m: 3.0                     # [m] margine aggiunto a ogni espansione

    lidar_topic: /velodyne_points
    lidar_frame: velodyne
    lidar_max_age_s: 0.3                   # [s] nuvola piu' vecchia di cosi' = non usata in quel frame
    lidar_min_range: 0.4                   # [m] scarta i punti piu' vicini

    max_range: 10.0                        # [m] distanza max per peso-distanza e occlusioni (>= map_write_max_range)
    map_write_max_range: 8.0
    max_obstacle_height: 0.64              # [m] CLEARANCE: sopra questa quota (da terra, base_footprint) non scrivere -> il robot ci passa sotto (panchine, tavoli, tettoie)

    # Full map publishing
    full_map_period_s: 1.0                 # [s] ripubblica la mappa piena ogni N secondi
    significant_change_cells: 15           # se >= N celle cambiano, pubblica SUBITO

    # Occlusion (polar z-buffer) -- ancora attiva; candidata a semplificazione con la geometria 3D nativa
    occ_sector_deg: 2.0                    # [deg] ampiezza angolare dei settori z-buffer
    occ_margin: 0.15                       # [m] oltre il primo ostacolo prima di dichiarare "occluso"
    w_dist_min: 0.03                       # peso minimo a max_range (vicino ~1, lontano piccolo)

    blocker_classes: [2,3,4,5,7,8,11,12,13,14,15,16,17,18]

    map_name: ''

    # Dynamic objects exclusion (per classe; il tracker serve sul reale -> map_static_dynamics:true)
    dynamic_classes: [11,12,13,14,15,16,17,18]
    dyn_v_thresh: 0.3                      # [m/s] sopra = "in movimento"
    dyn_gate: 1.0                          # [m] distanza max per associare una traccia tra frame
    dyn_min_obs: 3                         # min frame prima di fidarsi della velocita' stimata
    dyn_timeout: 1.0                       # [s] eta' max di una traccia non piu' vista
    dyn_vel_beta: 0.6                      # smoothing velocita' (EMA)
    map_static_dynamics: false             # false = una classe dinamica NON scrive MAI in mappa (anche se ferma)
    dyn_dilate_px: 6                       # [px] alone attorno ai dinamici dove non si scrive (bordi mal segmentati)

    alpha_min: 2.0
    alpha_max: 10.0
    fusion_decay: 1.0
    p_lethal: 0.5
    tf_timeout_s: 0.1

    # Gate di localizzazione ROBUSTO (EMA + isteresi)
    use_loc_quality_gate: false             # abilita/disabilita il gate
    loc_pose_topic: /odometry/local
    loc_cov_source: odometry               # 'odometry' per EKF (robot_localization)
    loc_std_suspend_m: 1.0                 # [m] std liscia sopra questo -> SOSPENDI
    loc_std_resume_m: 0.5                  # [m] sotto questo -> RIPRENDI (isteresi)
    loc_cov_ema: 0.4                       # smoothing covarianza (0..1; piu' alto = piu' reattivo)

elevation_costmap_node:
  ros__parameters:
    target_frame: odom
    base_frame: base_footprint
    lidar_frame: velodyne
    camera_optical_frame: c920_optical

    resolution: 0.05
    initial_size_m: 10.0
    grow_margin_m: 3.0

    # LiDAR (geometria)
    lidar_topic: /velodyne_points
    lidar_max_age_s: 0.3
    lidar_min_range: 0.4
    map_write_max_range: 8.0
    elev_min_rel: -1.0                 # [m] sotto (rel. al robot) = buco profondo: scartato
    elev_max_rel: 0.64                 # [m] sopra = overhead (chiome/insegne): scartato

    # Camera + segmentazione (SOLO per escludere i dinamici)
    seg_topic: /semantic/segmentation
    camera_info_topic: /c920/camera_info
    seg_max_age_s: 0.3
    dynamic_classes: [11,12,13,14,15,16,17,18]
    dyn_dilate_px: 12

    # Modello Kalman (misura + predizione)
    sensor_var_base: 0.0009            # (0.03 m)^2 rumore base
    sensor_var_dist: 0.0004            # coeff. * range^2 (piu' lontano = meno affidabile)
    var_init: 1.0                      # varianza cella mai vista
    var_max: 1.0                       # tetto varianza (inflazione)
    maha_thresh: 5.0                   # gate outlier (rumore residuo)
    min_var_for_valid: 0.25            # var oltre = cella non affidabile -> ignoto

    # Derivazione COSTO (traversabilita': slope/roughness/step)
    rough_win: 5                       # finestra roughness [celle]
    rough_min_known: 6                 # min vicini noti per validita'
    slope_crit: 0.35                   # [m/m] ~19 deg -> costo max
    rough_crit: 0.06                   # [m] std locale -> costo max
    step_crit: 0.10                    # [m] salto (cordolo) -> costo max

    # ADDED
    median_ksize: 5        # smoothing mediano (3=on; 0/1=off per confronto)
    slope_dead: 0.08
    rough_dead: 0.025
    step_dead: 0.04
    hybrid_k_sigma: 2.5

    raycast_enable: true
    raycast_end_margin: 0.25
    raycast_sigma_k: 3.0
    raycast_protect_s: 1.0
    attitude_topic: /pcl_pose
    elevazione_360: true
    modo_360:
      write_outside_camera: true
      use_segmentation: false
      confirm_s: 2.5
      process_var_rate: 0.0
      tilt_compensation: true
      raycast_every_n: 10
      raycast_stride: 4
    modo_camera:
      write_outside_camera: false
      use_segmentation: true
      confirm_s: 0.0
      process_var_rate: 0.005
      tilt_compensation: false
      raycast_every_n: 5
      raycast_stride: 2
    tilt_max_offset_m: 0.0
    tilt_max_deg: 1.5
    tf_timeout_s: 0.1

    # Publishing
    publish_period_s: 1.0
    out_topic: /elevation_cost

    # Gate di localizzazione (stesso schema del semantico)
    use_loc_quality_gate: false
    loc_pose_topic: /odometry/local
    loc_std_suspend_m: 1.0
    loc_std_resume_m: 0.5
    loc_cov_ema: 0.4

    map_name: ''

ssrl_combiner:
  ros__parameters:
    semantic_topic: /semantic_costmap
    elevation_topic: /elevation_cost
    out_topic: /ssrl_costmap
    # --- confinamento, ora calcolato qui ---
    use_confinement: true
    sidewalk_cost_max: 15
    conf_max: 40.0
    falloff: 0.4
    include_unknown_as_edge: false
    publish_confinement: true          # ripubblica /confinement_cost per RViz
    confinement_topic: /confinement_cost
    # --- elevation ---
    use_elevation: true
    w_elev: 0.6
    soft_ceiling: 97
    elev_can_be_lethal: false
    elev_lethal_thr: 92
    grid_tol_cells: 0.01

seg_infer_node:
  ros__parameters:
    image_topic: /c920/image_raw
    seg_topic: /semantic/segmentation
    image_encoding: bgr8

    # --- Modello / inferenza ---
    model_path: yolo26n-sem.pt
    device: cuda:0
    imgsz: 640
    half: true
    warmup: true

    # --- Contratto col consumer ---
    publish_at_input_res: true
    ignore_id: 255

    # Remap opzionale id-modello -> trainId. Vuoto = identita' (pesi ufficiali Cityscapes).
    label_remap: ""

    log_period_s: 5.0
    
semantic_overlay_node:
  ros__parameters:
    rgb_topic: /c920/image_raw
    seg_topic: /semantic/segmentation
    out_topic: /semantic/overlay_rgb

image_brighten_node:
  ros__parameters:
    in_topic: /c920/image_raw
    out_topic: /c920/image_bright
    gamma: 2.2
    gain: 1.0
