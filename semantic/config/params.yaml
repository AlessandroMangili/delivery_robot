# ============================================================
#  Pipeline SEGMENTAZIONE GROUND-TRUTH (Gazebo) -> COSTMAP
# ============================================================
gt_segmentation_relay:
  ros__parameters:
    labels_topic: /semantic/labels_map
    out_topic: /semantic/segmentation
    publish_overlay: true

semantic_costmap_node:
  ros__parameters:
    target_frame: map
    camera_optical_frame: camera_rgb_optical_frame
    base_frame: base_footprint
    resolution: 0.05
    pixel_stride: 4
    max_range: 5.0
    min_row_frac: 0.55

    # --- anti-spalmamento (proiezione) ---
    min_ray_downness: 0.08      # scarta raggi <~4.5 gradi sotto orizzonte (proiettano impreciso)
    map_write_max_range: 4.0    # scrivi in mappa solo entro questa distanza (IPM accurato)

    full_map_period_s: 1.5      # ripubblica la full map ogni N secondi (aggiornamento periodico)
    significant_change_cells: 15  # n. celle di cambiamento RILEVANTE -> pubblica SUBITO (nuovo ostacolo)

    # --- occlusione (z-buffer polare) ---
    occ_sector_deg: 2.0
    occ_margin: 0.15
    occ_weak: 0.10

    # --- pesi e confidenza ---
    w_dist_min: 0.03
    gate_ratio: 0.7
    blocker_classes: [2,3,4,5,7,8,11,12,13,14,15,16,17,18]

    # --- griglia auto-grow ---
    initial_size_m: 10.0
    grow_margin_m: 3.0

    # --- persistenza mappa (nome file in semantic/maps/) ---
    map_save_name: 'map1'
    map_load_name: 'map1'

    # --- oggetti dinamici (esclusi dalla mappa persistente) ---
    dynamic_classes: [11,12,13,14,15,16,17,18]
    dyn_v_thresh: 0.3
    dyn_gate: 1.0
    dyn_min_obs: 3
    dyn_timeout: 1.0
    dyn_vel_beta: 0.6

confinement_layer:
  ros__parameters:
    in_topic: /semantic_costmap
    out_topic: /confinement_cost
    sidewalk_cost_max: 15
    conf_max: 80.0
    falloff: 0.4
    include_unknown_as_edge: true

ssrl_combiner:
  ros__parameters:
    semantic_topic: /semantic_costmap
    layer_topics: ['/confinement_cost']
    out_topic: /ssrl_costmap