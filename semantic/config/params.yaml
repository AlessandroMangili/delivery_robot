segmentation_node:
  ros__parameters:
    # topic camera: deve combaciare con il bridge gz (vedi nota).
    #  - RAW       -> /camera/image            (use_compressed: false)
    #  - COMPRESSED-> /camera/image/compressed (use_compressed: true)
    image_topic: /camera/image
    use_compressed: false
    # SegFormer-B0 addestrato su Cityscapes: leggero e con la classe sidewalk.
    model_name: nvidia/segformer-b0-finetuned-cityscapes-1024-1024
    infer_width: 1024
    infer_height: 512
    publish_overlay: true
    device: auto          # auto | cuda | cpu
 
semantic_costmap_node:
  ros__parameters:
    target_frame: odom
    camera_optical_frame: camera_rgb_optical_frame
    base_frame: base_footprint
    resolution: 0.05
    size_m: 8.0
    pixel_stride: 4
    max_range: 6.0
    min_row_frac: 0.45