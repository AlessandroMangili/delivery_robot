segmentation_node:
  ros__parameters:
    image_topic: /camera/image
    model_name: nvidia/segformer-b0-finetuned-cityscapes-1024-1024
    infer_width: 512
    infer_height: 246
    publish_overlay: true

semantic_costmap_node:
  ros__parameters:
    target_frame: odom
    camera_optical_frame: camera_rgb_optical_frame
    base_frame: base_footprint
    resolution: 0.05
    size_m: 8.0
    pixel_stride: 4
    max_range: 6.0
    min_row_frac: 0.45
