dynamic_esdf_layer:
  ros__parameters:
    use_sim_time: true

    # --- topic ---
    scan_topic: /scan
    output_topic: /dynamic_cost

    # --- frame ---
    # IMPORTANTE: frame FISSO ma CONTINUO. Deve essere 'odom' (liscio, no salti),
    # NON 'map' (che salta a ogni correzione di localizzazione e falserebbe il
    # dESDF). Il moto del robot e' comunque compensato via TF.
    world_frame: odom
    robot_frame: base_link

    # --- griglia rolling ---
    size_m: 6.0          # lato finestra [m] (deve coprire il raggio di reazione utile)
    resolution: 0.05     # [m/cella] (allineata alla local costmap)
    rate_hz: 10.0        # frequenza di calcolo (limitata di fatto dalla freq. dello scan)

    # --- rilevamento dinamico ---
    # soglia anti-rumore: sotto questa |dESDF| = statico/rumore di localizzazione.
    # ALZALA se vedi falsi positivi su oggetti fermi; ABBASSALA se non rileva
    # pedoni lenti.
    desdf_thresh: 0.12

    # --- costo (Opzione 2: guadagno alto per far pesare di piu' i dinamici) ---
    # costo = cost_gain * (|dESDF| - desdf_thresh), saturato a max_cost.
    # cost_gain alto = evitamento dinamico piu' deciso (approssima omega3 > omega2
    # del paper senza pesi separati). Tetto a max_cost=100 (lethal).
    cost_gain: 200.0
    max_cost: 100

    # --- filtri ---
    esdf_ema: 0.4            # smoothing temporale ESDF (0=off, ->1 molto liscio)
    cost_dilate_cells: 2     # dilatazione zona di costo [celle] (margine anticipato)
    scan_timeout: 0.5        # [s] max eta' dello scan prima di scartarlo