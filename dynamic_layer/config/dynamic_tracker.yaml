pointcloud_detector:
  ros__parameters:
    input_topic: /velodyne_points           # LiDAR point cloud
    detections_topic: /detections           # output: centres of the detected objects
    markers_topic: /detections/markers      # boxes for display
    cloud_queue_depth: 1                    # clouds kept in the queue: 1 always uses the newest

    min_range: 0.30                         # closer points are ignored, they hit the robot [m]
    max_range: 12.0                         # farther points are too sparse to detect people [m]
    crop_min_z: -1.0                        # lowest point kept, in the LiDAR frame [m]
    crop_max_z: 2.5                         # highest point kept, in the LiDAR frame [m]

    voxel_size: 0.10                        # one point per voxel of this size [m]

    ground_dist_thresh: 0.08                # points closer than this to the ground plane are ground [m]
    ground_max_iter: 150                    # RANSAC iterations
    ground_fit_range: 6.0                   # the plane is fitted on points within this range [m]
    ground_normal_z_min: 0.85               # the plane must be close to horizontal
    remove_below_ground: true               # also drops points below the ground plane

    cluster_tolerance: 0.30                 # points closer than this belong to the same cluster [m]
    cluster_min_points: 6                   # smallest cluster
    cluster_max_points: 800                 # largest cluster
    merge_enabled: true                     # merges clusters of the same object, such as two legs
    merge_dist: 0.45                        # clusters with closer centres are merged [m]

    min_height: 0.20                        # lowest object that can be a person [m]
    max_height: 2.20                        # tallest object that can be a person [m]
    max_footprint: 1.00                     # widest object that can be a person [m]

    map_filter: true                        # drops clusters that lie on the prior LiDAR map
    map_filter_dist: 0.20                   # distance from the map that counts as on the map [m]
    map_filter_frac: 0.50                   # share of points on the map that drops a cluster
    map_filter_min_dist: 3.0                # clusters closer than this are never dropped by the map [m]

    camera_rescue: true                     # keeps rejected clusters that fall inside a YOLO box
    yolo_topic: /camera_detections          # boxes from camera_detector
    camera_info_topic: /c920/camera_info    # camera intrinsics
    camera_frame: c920_optical              # optical frame of the camera
    rescue_classes: [person, bicycle, motorcycle]   # YOLO classes that can rescue a cluster
    rescue_max_footprint: 2.0               # widest rescued object [m]
    rescue_box_margin: 0.10                 # margin added around each box, as a share of its size
    rescue_max_age: 0.25                    # oldest box used for a scan [s]
    rescue_depth_band: 0.40                 # depth band behind the nearest points of the box [m]

    debug_show_rejected: true               # also draws the rejected clusters, in red
    diag_period_frames: 20                  # scans between two diagnostic logs

tracker_3d:
  ros__parameters:
    input_topic: /detections                # detections from pointcloud_detector
    tracking_frame: odom                    # fixed frame in which the tracks live
    markers_topic: /tracks/markers          # tracks for display
    tracks_topic: /dynamic_tracks_state     # output read by the MPPI critics

    accel_std: 0.8                          # acceleration noise of the constant-velocity Kalman filter [m/s^2]
    meas_std: 0.10                          # noise of a detected position [m]
    init_pos_std: 0.30                      # position uncertainty of a new track [m]
    init_vel_std: 2.0                       # velocity uncertainty of a new track [m/s]

    gating_mahalanobis: 9.21                # association gate, chi-square with 2 degrees of freedom at 99%
    max_assoc_dist: 1.5                     # farthest detection associated to a track [m]
    recovery_dist: 1.0                      # second gate for turning targets, 0 turns it off [m]

    min_hits: 3                             # detections needed to confirm a track
    max_age: 10                             # frames without detection before a track is deleted
    coast_publish_frames: 3                 # frames without detection during which a track is still published

    min_speed: 0.30                         # speed above which a track can be moving [m/s]
    snr_min: 1.0                            # the speed must also exceed this multiple of its uncertainty
    promote_frames: 4                       # consecutive moving frames to mark a track as moving
    demote_frames: 15                       # consecutive still frames to mark it as still again
    disp_window: 1.5                        # window over which the displacement is checked [s]
    disp_min: 0.3                           # smallest displacement in that window to count as moving [m]
    dup_dist: 1.5                           # confirmed tracks closer than this ... [m]
    dup_vel: 0.8                            # ... and with similar velocity are merged [m/s]

    use_static_map_gate: true               # drops tracks that sit on hard structure of the semantic map
    static_map_topic: /semantic_costmap     # semantic map
    static_cost_thresh: 99                  # cost that counts as hard structure
    static_gate_radius_cells: 2             # cells around the track that are checked

    use_semantic_gate: true                 # drops tracks that the camera sees as a static class
    seg_topic: /semantic/segmentation       # segmentation from seg_infer_node
    camera_info_topic: /c920/camera_info    # camera intrinsics
    camera_frame: c920_optical              # optical frame of the camera
    probe_height: 0.9                       # height at which the track is projected into the image [m]
    probe_patch: 2                          # half size of the pixel patch that is checked [px]
    sem_static_hits: 2                      # consecutive static readings that drop a track
    static_seg_classes: [2, 3, 4, 5, 7, 8]                  # building, wall, fence, pole, sign, vegetation
    dynamic_seg_classes: [11, 12, 13, 14, 15, 16, 17, 18]   # person, rider and vehicles

    use_yolo_gate: true                     # confirms tracks with the YOLO boxes
    yolo_topic: /camera_detections          # boxes from camera_detector
    yolo_max_age: 0.5                       # oldest box used for a frame [s]
    yolo_probe_heights: [0.4, 0.9, 1.4]     # heights projected into the image to match a box [m]
    yolo_box_margin: 0.10                   # margin added around each box, as a share of its size
    yolo_hits: 2                            # matched frames that give a track its YOLO class
    yolo_forget: 10                         # missed frames that remove it
    publish_yolo_static: true               # publishes YOLO-confirmed people even when still
    yolo_static_classes: [person]           # classes published even when still
    lidar_publish_range: 6.0                # tracks not confirmed by YOLO are published only within this range [m]

    marker_z: 0.6                           # height of the markers [m]
    arrow_time_scale: 1.0                   # length of the velocity arrow, in seconds of motion [s]
    publish_static: false                   # also draws still tracks, in grey
    diag_period_frames: 20                  # frames between two diagnostic logs

camera_detector:
  ros__parameters:
    image_topic: /c920/image_raw            # camera images
    detections_topic: /camera_detections    # output: 2D boxes
    model_path: detection.pt                # weights in dynamic_layer/models, or an absolute path
    device: cuda:0                          # GPU used for inference
    imgsz: 640                              # network input size [px]
    conf: 0.35                              # confidence threshold
    classes: [0, 1, 3]                      # COCO classes: person, bicycle, motorcycle
    max_hz: 10.0                            # highest detection rate [Hz]
    log_period_s: 10.0                      # period of the rate log [s]
