pointcloud_detector:
  ros__parameters:
    use_sim_time: false
    input_topic: /velodyne_points
    coda_nuvole: 1
    detections_topic: /detections
    markers_topic: /detections/markers

    # crop
    min_range: 0.30        # scarta il corpo del robot / punti troppo vicini
    max_range: 12.0        # oltre, il LiDAR è rado/rumoroso
    crop_min_z: -1.0       # box in z, frame sensore (base_scan)
    crop_max_z: 2.5

    # downsample
    voxel_size: 0.10       # alza se il clustering è lento

    # rimozione piano di terra (RANSAC)
    ground_dist_thresh: 0.08
    ground_max_iter: 150
    ground_fit_range: 6.0
    ground_normal_z_min: 0.85   # |n_z| min: piano ~orizzontale = terra, non muro
    remove_below_ground: true

    # clustering euclideo
    cluster_tolerance: 0.30     # distanza max tra punti dello stesso cluster
    cluster_min_points: 6
    cluster_max_points: 800
    # merge world-space: riunisce cluster frammentati (gambe di una persona)
    merge_enabled: true
    merge_dist: 0.45              # < distanza tra 2 persone, > tra le gambe di una

    # filtro geometrico "persona" (permissivo: la camera rifinisce in Step 3)
    min_height: 0.20
    max_height: 2.20
    max_footprint: 1.00         # ingombro orizzontale max (muri lunghi cadono qui)

    # diagnostica / debug
    debug_show_rejected: true   # cluster scartati in rosso in RViz (per tarare)
    map_filter: true
    map_filter_dist: 0.20
    map_filter_frac: 0.50
    map_filter_min_dist: 3.0
    camera_rescue: true
    yolo_topic: /camera_detections
    camera_info_topic: /c920/camera_info
    camera_frame: c920_optical
    rescue_classes: [person, bicycle, motorcycle]
    rescue_max_footprint: 2.0
    rescue_box_margin: 0.10
    rescue_max_age: 0.25
    rescue_depth_band: 0.40
    diag_period_frames: 20


lidar3d_tracker:
  ros__parameters:
    use_sim_time: false
    input_topic: /detections
    tracking_frame: odom          # frame fisso: NON base_scan (ruota col robot)
    markers_topic: /tracks/markers

    # --- Step 4: uscita verso il critic spazio-temporale MPPI ---
    tracks_topic: /dynamic_tracks_state   # dynamic_tracker_msgs/TrackArray consumato dal critic

    # Kalman (velocità costante)
    accel_std: 0.8                # tarato: statico fermo resta sotto ~0.12 m/s
    meas_std: 0.10               # rumore misura di posizione [m]
    init_pos_std: 0.30
    init_vel_std: 2.0

    # associazione
    gating_mahalanobis: 9.21     # chi^2, 2 gdl, ~99%
    max_assoc_dist: 1.5          # gate euclideo di sicurezza [m]
    recovery_dist: 1.0           # 2° stadio: gate euclideo di recupero [m] per i target
                                 # in manovra (svolta) rifiutati dal Mahalanobis (0 = off)
    # ciclo di vita
    min_hits: 3                  # frame per confermare una traccia
    max_age: 10                  # frame di coasting (10 = ~1 s a 10 Hz)
    coast_publish_frames: 3      # frame di coasting per cui la traccia resta PUBBLICATA
                                 # (fantasma corto; resta viva fino a max_age per ri-associarsi)
    # conferma dinamico / life-cycle (SimpleTrack: moto coerente + gate SNR)
    min_speed: 0.30              # [m/s] soglia di "in movimento"
    snr_min: 1.0                 # velocità >= snr_min * incertezza -> direzione affidabile
    promote_frames: 4            # frame di moto coerente consecutivi per promuovere
    demote_frames: 15
    disp_window: 1.5
    disp_min: 0.3
    dup_dist: 1.5
    dup_vel: 0.8

    # cross-check con la mappa semantica statica
    use_static_map_gate: true
    static_map_topic: /semantic_costmap
    static_cost_thresh: 99          # 100 = struttura dura mappata (muro/edificio/albero)
    static_gate_radius_cells: 2     # finestra di celle attorno alla traccia (assorbe il jitter)
    # gate semantico camera sulle tracce (/semantic/segmentation, ID Cityscapes)
    use_semantic_gate: true
    seg_topic: /semantic/segmentation
    camera_info_topic: /c920/camera_info
    camera_frame: c920_optical
    probe_height: 0.9              # [m] quota a cui proiettare la traccia (mezzo busto)
    probe_patch: 2                # semi-finestra pixel per il voto di maggioranza
    sem_static_hits: 2            # letture statiche consecutive per scartare la traccia
    static_seg_classes: [2, 3, 4, 5, 7, 8]              # building/wall/fence/pole/sign/vegetation
    dynamic_seg_classes: [11, 12, 13, 14, 15, 16, 17, 18]  # person/rider/car/.../bike

    use_yolo_gate: true
    yolo_topic: /camera_detections
    yolo_max_age: 0.5
    yolo_probe_heights: [0.4, 0.9, 1.4]
    yolo_box_margin: 0.10
    yolo_hits: 2
    yolo_forget: 10
    publish_yolo_static: true
    yolo_static_classes: [person]
    lidar_publish_range: 6.0

    # visualizzazione
    marker_z: 0.6
    arrow_time_scale: 1.0        # lunghezza freccia = velocità * questo [s]
    publish_static: false        # true = mostra in grigio anche le tracce ferme (debug)
    diag_period_frames: 20


camera_detector:
  ros__parameters:
    use_sim_time: false
    image_topic: /c920/image_raw
    detections_topic: /camera_detections
    model_path: yolo26n.pt
    device: cuda:0
    imgsz: 640
    conf: 0.35
    classes: [0, 1, 3]
    max_hz: 10.0
    log_period_s: 10.0
