dynamic_esdf_layer:
  ros__parameters:
    use_sim_time: true
 
    # --- I/O e frame ---
    scan_topic: /scan
    output_topic: /dynamic_cost
    world_frame: odom            # FISSO ma continuo (non 'map')
    robot_frame: base_link
    odom_topic: /odom
 
    # --- griglia rolling ---
    size_m: 8.0
    resolution: 0.05
    rate_hz: 10.0
    max_range: 8.0
 
    # --- clustering LiDAR (unisce le due gambe in UN oggetto) ---
    cluster_eps_m: 0.5          # punti entro 50cm = stesso oggetto (gambe ~35cm)
    cluster_min_pts: 2
    cluster_max_size_m: 1.5     # scarta cluster piu' grandi (muri estesi)
 
    # --- tracking ---
    gate_dist_m: 0.7
    vel_ema: 0.4               # smoothing velocita'
    pos_ema: 0.5               # smoothing posizione
    min_obs: 3                 # frame min prima di fidarsi del track
    track_timeout_s: 0.6
    min_speed: 0.30           # [m/s] sotto = fermo, niente nucleo ne' cono (statico)
 
    # --- proiezione cono ---
    horizon_s: 2.0             # [s] lunghezza cono ~ velocita' x horizon
    cone_halfwidth_m: 0.4
    cone_spread: 1.5
    max_cost: 100
    mark_obstacle: true        # marca anche il nucleo dell'oggetto dinamico
    gate_ang_vel: 1.0          # [rad/s] sopra: sospendi coni (rotazione rapida)
 
    # ============ CAMERA: validazione dinamico/statico ============
    # true  = FUSIONE LiDAR+camera (raccomandata): gli statici NON entrano.
    #         Il LiDAR trova posizione/velocita' (360 gradi), la camera valida
    #         ogni track come dynamic/static. L'etichetta persiste fuori dal FOV.
    # false = solo LiDAR (nessuna validazione classe; puo' prendere statici in
    #         rotazione). Utile per test o se la camera non e' disponibile.
    use_camera: false
    seg_topic: /semantic/segmentation
    info_topic: /camera/camera_info
    camera_optical_frame: camera_rgb_optical_frame
    dynamic_classes: [11, 12, 13, 14, 15, 16, 17, 18]  # person/rider/veicoli
    cam_assoc_m: 0.8           # tolleranza associazione track<->pixel-camera
    cam_fov_deg: 40.0          # semi-apertura campo visivo camera (per il FOV check)
    cone_if_unknown: false     # track non ancora validato NON genera cono (prudente)
