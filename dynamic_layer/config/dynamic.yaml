dynamic_tracker:
  ros__parameters:
    use_sim_time: true

    # ===== I/O e frame =====
    seg_topic: '/semantic/segmentation'
    # immagine di profondita' (16UC1 in mm o 32FC1 in m)
    depth_topic: '/camera/depth_image'
    depth_reliability: best_effort
    camera_info_topic: '/camera/camera_info'
    output_topic: '/dynamic_cost'
    tracks_topic: '/dynamic_tracks_state'
    markers_topic: '/dynamic_tracks'
    debug_points_topic: '/dynamic_tracker/semantic_points'
    world_frame: 'odom'
    robot_frame: 'base_link'
    # trainId Cityscapes: 11 person, 12 rider, 17 motorcycle, 18 bicycle
    dynamic_classes: [11, 12, 17, 18]
    max_seg_age_s: 0.5
    # ===== griglia rolling e cono =====
    size_m: 8.0
    resolution: 0.05
    rate_hz: 10.0
    enable_cone: True
    mark_obstacle: True
    horizon_s: 3.0
    cone_min_length: 4.0
    cone_halfwidth_m: 0.4
    cone_spread: 1.5
    max_cost: 100
    nucleus_radius_m: 0.20
    cone_base_cost: 99
    cone_tip_cost: 90
    cone_lateral_falloff: 0.35
    gate_ang_vel: 1.0
    # ===== RILEVANZA: a chi serve un cono =====
    relevance_enabled: True
    cone_sector_deg: 180.0
    # direzione del cono dallo spostamento reale su una finestra (non dalla
    # velocita' istantanea, che per una traccia nuova punta a caso). Il cono
    # appare solo dopo cone_min_disp_m di spostamento netto: niente flip iniziale.
    cone_dir_window: 6
    cone_min_disp_m: 0.15
    # pixel minimi perche' una maschera conti come persona
    min_region_px: 40
    # pixel con profondita' valida minimi per fidarsi della distanza
    min_valid_depth_px: 10
    # fusione nel mondo: due detection piu' vicine di questa distanza (m) e a
    # profondita' simile sono la stessa persona (le due gambe). Invariante alla
    # distanza. 0.4 unisce le gambe senza fondere due persone affiancate.
    person_merge_dist_m: 0.4
    person_merge_depth_m: 0.6
    # (gap tipico 8-12 px). 0 = disattivato. Se una persona si sdoppia, alza a 13-15.
    # range utile della depth: sotto e sopra si scarta
    depth_min_m: 0.3
    depth_max_m: 8.0
    # 0=direzione congelata, 1=nessun lisciamento
    # ===== tracking =====
    gate_dist_m: 0.7
    min_obs: 3
    track_timeout_s: 0.6
    min_speed: 0.40
    promote_frames: 4
    demote_frames: 8
    # ===== filtro di Kalman (velocita' costante) =====
    kf_sigma_a: 0.6
    # [m] quanto balla la misura di posizione
    kf_sigma_z: 0.12
    kf_v_init: 1.0
    kf_min_snr: 1.0