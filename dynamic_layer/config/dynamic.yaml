dynamic_esdf_layer:
  ros__parameters:
    use_sim_time: true
 
    # --- I/O e frame ---
    scan_topic: /scan
    output_topic: /dynamic_cost
    world_frame: odom            # FISSO ma continuo (non 'map')
    robot_frame: base_link
    odom_topic: /odom
 
    # --- griglia rolling ---
    size_m: 8.0
    resolution: 0.05
    rate_hz: 10.0
    max_range: 8.0
 
    # --- clustering LiDAR (unisce le due gambe in UN oggetto) ---
    cluster_eps_m: 0.5          # punti entro 50cm = stesso oggetto (gambe ~35cm)
    cluster_min_pts: 2
    cluster_max_size_m: 1.5     # scarta cluster piu' grandi (muri estesi)
 
    # --- tracking ---
    gate_dist_m: 0.7
    vel_ema: 0.4               # smoothing velocita'
    pos_ema: 0.5               # smoothing posizione
    min_obs: 3                 # frame min prima di fidarsi del track
    track_timeout_s: 0.6
    min_speed: 0.40            # [m/s] soglia di velocita' per considerare "in movimento"

    # --- conferma dinamico: N frame consecutivi di movimento (con isteresi) ---
    # Un track diventa "dinamico" solo dopo essere stato in movimento (velocita'
    # sopra min_speed E sopra il rumore del Kalman) per promote_frames frame
    # consecutivi, e solo dopo min_obs osservazioni (Kalman stabilizzato). Evita
    # che un cluster appena nato con velocita' rumorosa venga promosso subito.
    # Isteresi: torna statico solo dopo demote_frames frame lenti, cosi' il cono
    # non lampeggia. Tuning: passano statici -> alza promote_frames; pedoni persi
    # -> abbassa promote_frames o min_speed; cono lampeggia -> alza demote_frames.
    promote_frames: 4          # ~0.4s a 10Hz di movimento consecutivo
    demote_frames: 8           # ~0.8s fermo prima di tornare statico

    # --- cono di costo: disattivabile ---
    # Il cono scrive costo davanti al pedone nella costmap, ma e' cieco al tempo.
    # Il critic spazio-temporale fa la stessa cosa in modo piu' informato.
    # enable_cone: false lascia il nucleo (il pedone e' un ostacolo fisico) ma
    # toglie la proiezione: serve a misurare il critic da solo.
    enable_cone: true

 
    # --- proiezione cono ---
    horizon_s: 3.0             # [s] lunghezza cono ~ velocita' x horizon
    cone_min_length: 4.0       # [m] lunghezza minima anche a bassa velocita'
    cone_halfwidth_m: 0.4      # semi-larghezza del cono alla base
    cone_spread: 1.5           # quanto si allarga verso la punta
    max_cost: 100              # costo del NUCLEO (corpo pedone): letale
    nucleus_radius_m: 0.20     # raggio del nucleo letale: piccolo, solo il pedone
    cone_base_cost: 99         # costo BASE cono: 99->251 quasi letale ma uscibile (100 = letale/intrappola)
    cone_tip_cost: 90          # costo alla PUNTA: alto = reagisce prima
    cone_lateral_falloff: 0.35 # quanto cala il costo dal centro ai bordi (via di fuga laterale)
    mark_obstacle: true        # marca il nucleo dell'oggetto dinamico
    gate_ang_vel: 1.0          # [rad/s] sopra: sospendi coni (rotazione rapida)

    # ----- FILTRO DI KALMAN (modello a velocita' costante) -----
    # Sostituisce la doppia EMA (pos_ema/vel_ema, ora DEPRECATE ma lasciate per compatibilita').
    # Stima velocita' + covarianza: direzione del cono STABILE, coasting durante le occlusioni.
    kf_sigma_a: 0.6      # [m/s^2] quanto il pedone puo' accelerare/svoltare.
                         #   ALTO  = filtro reattivo ma nervoso (direzione balla)
                         #   BASSO = liscio ma in ritardo sulle svolte. 0.6 = pedone normale.
    kf_sigma_z: 0.12     # [m] quanto BALLA il centroide del cluster LiDAR (gambe, forma).
                         #   Se il cono e' ancora nervoso: ALZA (0.15-0.20) = fidati meno della singola misura, il filtro liscia di piu'.
    kf_v_init: 1.0       # [m/s] incertezza iniziale sulla velocita' di una traccia nuova
    kf_min_snr: 1.0      # velocita' >= N * sigma_v per fidarsi della DIREZIONE del cono.
                         #   Sotto questa soglia: marca il nucleo ma NIENTE cono (la direzione sarebbe rumore, non informazione). 0 = disattiva.

dynamic_tracker:
  ros__parameters:
    use_sim_time: true

    # ===== I/O e frame =====
    scan_topic: '/scan'
    seg_topic: '/semantic/segmentation'
    # immagine di profondita' (16UC1 in mm o 32FC1 in m)
    depth_topic: '/camera/depth_image'
    # se non arriva nulla: prova 'reliable', oppure cambia depth_topic in /camera/depth_image
    depth_reliability: best_effort
    camera_info_topic: '/camera/camera_info'
    odom_topic: '/odom'
    output_topic: '/dynamic_cost'
    tracks_topic: '/dynamic_tracks_state'
    markers_topic: '/dynamic_tracks'
    debug_points_topic: '/dynamic_tracker/semantic_points'
    world_frame: 'odom'
    robot_frame: 'base_link'
    # ===== FUSIONE SEMANTICA (camera classifica, LiDAR misura) =====
    # trainId Cityscapes: 11 person, 12 rider, 17 motorcycle, 18 bicycle
    dynamic_classes: [11, 12, 17, 18]
    # (solo lidar/fusion) tolleranza in pixel della proiezione LiDAR
    pixel_dilation: 2
    # (solo lidar/fusion) frazione per confermare un cluster LiDAR
    min_semantic_frac: 0.4
    min_fov_points: 2
    # (solo lidar/fusion) false=tiene gli ignoti fuori FOV
    require_semantic: False
    sem_score_max: 5
    max_seg_age_s: 0.5
    # ===== griglia rolling e cono =====
    size_m: 8.0
    resolution: 0.05
    max_range: 8.0
    rate_hz: 10.0
    enable_cone: True
    mark_obstacle: True
    horizon_s: 3.0
    cone_min_length: 4.0
    cone_halfwidth_m: 0.4
    cone_spread: 1.5
    max_cost: 100
    nucleus_radius_m: 0.20
    cone_base_cost: 99
    cone_tip_cost: 90
    cone_lateral_falloff: 0.35
    gate_ang_vel: 1.0
    # ===== RILEVANZA: a chi serve un cono =====
    relevance_enabled: True
    relevance_horizon_s: 10.0
    relevance_radius_m: 2.0
    relevance_always_dist_m: 0.8
    # settore frontale del cono. 180=davanti+lati (no retromarcia). 72=solo FOV camera
    cone_sector_deg: 180.0
    # ===== MODALITA' DI RILEVAMENTO =====
    # 'camera'=maschera semantica+depth (preciso, solo FOV). 'lidar'=vecchio front-end (360). 'fusion'=camera nel FOV + LiDAR fuori
    detection_mode: 'camera'
    # pixel minimi perche' una maschera conti come persona
    min_region_px: 40
    # pixel con profondita' valida minimi per fidarsi della distanza
    min_valid_depth_px: 10
    # riunisce le gambe di una stessa persona quando il busto non e' segmentato
    # (gap tipico 8-12 px). 0 = disattivato. Se una persona si sdoppia, alza a 13-15.
    leg_merge_px: 11
    # se la chiusura unisce due persone vicine, rispezza la regione troppo larga
    split_wide: true
    max_person_width_m: 0.8
    # range utile della depth: sotto e sopra si scarta
    depth_min_m: 0.3
    depth_max_m: 8.0
    # 0=direzione congelata, 1=nessun lisciamento
    cone_dir_ema: 0.3
    # ===== clustering (solo modalita lidar/fusion) =====
    cluster_eps_m: 0.5
    cluster_min_pts: 2
    cluster_max_size_m: 1.5
    # ===== tracking =====
    gate_dist_m: 0.7
    min_obs: 3
    track_timeout_s: 0.6
    min_speed: 0.40
    promote_frames: 4
    demote_frames: 8
    # ===== filtro di Kalman (velocita' costante) =====
    kf_sigma_a: 0.6
    # [m] quanto balla la misura di posizione
    kf_sigma_z: 0.12
    kf_v_init: 1.0
    kf_min_snr: 1.0