yolo_detect_node:
  ros__parameters:
    use_sim_time: true
    model_path: yolov8n.pt                 # Ultralytics weights, downloaded on first use
    image_topic: /camera/image
    image_out_topic: /yolo/detections_image
    publish_image: false                   # annotated image for RViz, for debugging
    det_out_topic: /yolo/detections
    conf: 0.5                              # detection threshold
    imgsz: 320                             # inference size [px]
    person_only: true                      # keep only the person class
    device: cpu                            # cpu or cuda:0
    process_every_n: 2                     # run on one image every N: the tracker only needs the latest one

pointpillars_detector:
  ros__parameters:
    use_sim_time: true
    cloud_topic: /scan/points
    markers_topic: /detections/markers     # boxes for RViz
    detections3d_topic: /detections3d
    cfg_file: cfgs/custom_models/pointpillar.yaml               # model config, relative to cfg_dir
    cfg_dir: /mnt/2tbpartition/mangili/OpenPCDet/tools          # OpenPCDet tools folder
    ckpt: /home/mangili/Downloads/checkpoint_epoch_80.pth       # trained PointPillars checkpoint
    score_thresh: 0.30                     # detection threshold
    debug_show_rejected: false             # also draws the boxes below the threshold
    diag_period_frames: 20                 # one timing line every N clouds (0 = off)

eagermot_tracker_node:
  ros__parameters:
    use_sim_time: true
    detections3d_topic: /detections3d
    yolo_topic: /yolo/detections
    camera_info_topic: /camera/camera_info
    tracks_topic: /dynamic_tracks_state    # tracks read by the critic
    markers_topic: /tracks/markers
    tracking_frame: odom
    sensor_frame: base_scan
    camera_frame: camera_rgb_optical_frame

    theta_fusion: 0.3                      # IoU needed to pair a 3D box with a 2D box (EagerMOT paper)
    theta_3d: 1.8                          # largest scaled distance for a 3D match (EagerMOT paper)
    theta_2d: 0.5                          # IoU needed for a 2D match (EagerMOT paper)

    age_max: 10                            # frames a track is kept without any update, so it keeps its ID
    age_2d: 3                              # a track seen by the camera in the last N frames is confirmed
    age_3d: 8                              # a track seen by the LiDAR in the last N frames is confirmed too (-1 = paper rule, camera only)
    confirm_coast_frames: 8                # frames a confirmed track stays published without a match
    dup_suppress_radius: 0.5               # an unmatched 3D detection this close to a track updates it or is dropped [m]
    min_hits_3d: 3                         # updates needed before a LiDAR-only track is confirmed

    kf_p_pos: 10.0                         # initial variance of the position
    kf_p_vel: 9.0                          # initial variance of the velocity
    kf_q_pos: 0.01                         # process noise of the position
    kf_q_vel: 0.05                         # process noise of the velocity
    kf_r_meas: 0.03                        # measurement noise of the box centre

    min_speed: 0.0                         # tracks slower than this are not published [m/s]
    marker_z: 0.6                          # height of the RViz markers [m]
    arrow_time_scale: 1.0                  # length of the velocity arrow [s]
    diag_period_frames: 20                 # one diagnostic line every N frames (0 = off)
    tf_timeout_s: 0.10                     # longest wait for a transform [s]
